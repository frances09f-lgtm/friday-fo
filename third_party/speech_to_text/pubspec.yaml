name: speech_to_text
description: Friday's copy of speech_to_text 7.5.0 (adds EXTRA_BIASING_STRINGS on Android 13+). A Flutter plugin that exposes device specific speech to text recognition capability.
version: 7.5.0
homepage: https://github.com/csdcorp/speech_to_text

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text_platform_interface: ^2.4.0
  json_annotation: ^4.0.0
  clock: ^1.0.1
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.1.7
  web: ^1.0.0
  speech_to_text_windows: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.csdcorp.speech_to_text
        pluginClass: SpeechToTextPlugin
      ios:
        pluginClass: SpeechToTextPlugin
        sharedDarwinSource: true
      web:
        pluginClass: SpeechToTextPlugin
        fileName: speech_to_text_web.dart
      macos:
        pluginClass: SpeechToTextPlugin
        sharedDarwinSource: true
      windows: 
        default_package: speech_to_text_windows

# Friday: vendored from pub.dev speech_to_text 7.5.0 (BSD-3, see LICENSE).
