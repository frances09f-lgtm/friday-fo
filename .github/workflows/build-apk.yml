name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, redesign/orion-ui, fix/v76-alerts]
jobs:
  build:
    concurrency:
      group: friday-v76-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.FRIDAY_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/friday-release.jks
          cat >> android/gradle.properties <<GP
          FRIDAY_KEYSTORE_FILE=$RUNNER_TEMP/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD=${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS=${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD=${{ secrets.FRIDAY_KEY_PASSWORD }}
          GP
      - name: CI build memory (keep local low-memory settings unchanged)
        run: |
          free -m
          cat >> android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          GP
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.76 --build-number=76
      - name: Native task evaluation tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
      - name: Size report and APK checks
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIZE=$(stat -c %s "$APK")
          {
            echo "Alerts fix on top of v75: Alerts tab refreshes when you return to the app, has buttons for notification permission, exact alarms and battery limit, and all notification channels are created at startup. Includes the v75 size cut and smaller bubble and bar. Checked by CI, not tested on a phone."
            echo
            echo "APK size: $SIZE bytes (v74 was 159865680 bytes, v75 was 40654213 bytes)"
            echo
            echo "Native libraries per ABI, uncompressed bytes:"
            unzip -l "$APK" | awk '$4 ~ /^lib\// {split($4,a,"/"); s[a[2]]+=$1} END{for(k in s) print "  " k ": " s[k]}'
            echo
            echo "Largest entries, uncompressed bytes / stored bytes / name:"
            unzip -lv "$APK" | awk '$1 ~ /^[0-9]+$/ && $8 != "" {print $1, $3, $8}' | sort -nr | head -12 | sed 's/^/  /'
            echo
            echo "Package check:"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^native-code:" | sed 's/ compileSdkVersion.*//'
          } > release-body.md
          "$BT/apksigner" verify "$APK" && echo "apksigner verify: ok"
          cat release-body.md
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Friday.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: friday-release-apk
          path: "build/app/outputs/flutter-apk/Friday.apk"
      - name: Publish GitHub release v76
        if: github.ref_name == 'fix/v76-alerts'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v76
          name: Friday v76
          target_commitish: ${{ github.sha }}
          make_latest: false
          body_path: release-body.md
          files: build/app/outputs/flutter-apk/Friday.apk
