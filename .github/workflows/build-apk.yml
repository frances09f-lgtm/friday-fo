name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [size/v75-diag]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: CI build memory
        run: |
          cat >> android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          GP
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.74 --build-number=74
      - name: Baseline APK breakdown (v74 code, diagnostic only, not published)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "BASELINE_SIZE_BYTES=$(stat -c %s "$APK")"
          echo "BASELINE_NATIVE_PER_ABI_UNCOMPRESSED"
          unzip -l "$APK" | awk '$4 ~ /^lib\// {split($4,a,"/"); s[a[2]]+=$1} END{for(k in s) print "  " k ": " s[k]}'
          echo "BASELINE_LARGEST_ENTRIES uncompressed stored name"
          unzip -lv "$APK" | awk '$1 ~ /^[0-9]+$/ && $8 != "" {print $1, $3, $8}' | sort -nr | head -25
          echo "BASELINE_BY_TOP_FOLDER uncompressed bytes"
          unzip -l "$APK" | awk '$1 ~ /^[0-9]+$/ && $4 != "" {n=split($4,a,"/"); k=(n>1?a[1]:$4); s[k]+=$1} END{for(k in s) print "  " k ": " s[k]}' | sort -t: -k2 -nr | head -10
