name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, redesign/orion-ui, fix/v78-reminders, feat/shruti-voice]
jobs:
  build:
    concurrency:
      group: friday-v78-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.FRIDAY_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/friday-release.jks
          cat >> android/gradle.properties <<GP
          FRIDAY_KEYSTORE_FILE=$RUNNER_TEMP/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD=${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS=${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD=${{ secrets.FRIDAY_KEY_PASSWORD }}
          GP
      - name: CI build memory (keep local low-memory settings unchanged)
        run: |
          free -m
          cat >> android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          GP
      - name: Install Android NDK and CMake for the Shruti native build
        run: |
          NDK_VER=$(grep -rhoE '[0-9]{2}\.[0-9]\.[0-9]{7}' "$FLUTTER_ROOT/packages/flutter_tools/gradle" | sort -Vu | tail -1)
          NDK_VER=${NDK_VER:-29.0.1384606}
          echo "Flutter-pinned NDK: $NDK_VER"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "ndk;$NDK_VER" "cmake;3.22.1"
      - name: Fetch needle speech engine (Shruti, Apache-2.0)
        run: |
          DEST=android/app/src/main/cpp/needle/lib/arm64-v8a
          mkdir -p "$DEST"
          # Pinned needle3 revision d6c7d6a2e9655505e0f8e23339356dd1705900eb
          curl -fL --retry 3 https://huggingface.co/Cactus-Compute/needle3/resolve/d6c7d6a2e9655505e0f8e23339356dd1705900eb/android-arm64/libneedle.a -o "$DEST/libneedle.a"
          echo "7aa6de6132a22bf45f5e903425feb66f159ad46f47fa558921bc4fd02c3a2fa0  $DEST/libneedle.a" | sha256sum -c -
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Render Shruti settings card states to PNG
        run: flutter test test/shruti_voice_card_visual_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: shruti-card-renders
          path: test_output/*.png
      - run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.79.shruti --build-number=${{ github.run_number }}
      - name: Native task evaluation tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
      - name: Size report and APK checks
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIZE=$(stat -c %s "$APK")
          {
            echo "Simple reminders (remind me to X at 9:42, at 942, in 10 minutes) are now read by plain code and saved, in the Friday chat and in the floating bar. The assistant bar is back at the v74 size (full screen width, same height as v74); the bubble keeps the v75 size. Includes the v76 alerts fix and the v75 size cut. Checked by CI, not tested on a phone."
            echo
            echo "APK size: $SIZE bytes (v74 was 159865680 bytes, v75 was 40654213 bytes, v76 was 40658493 bytes, v77 was 40658477 bytes)"
            echo
            echo "Native libraries per ABI, uncompressed bytes:"
            unzip -l "$APK" | awk '$4 ~ /^lib\// {split($4,a,"/"); s[a[2]]+=$1} END{for(k in s) print "  " k ": " s[k]}'
            echo
            echo "Largest entries, uncompressed bytes / stored bytes / name:"
            unzip -lv "$APK" | awk '$1 ~ /^[0-9]+$/ && $8 != "" {print $1, $3, $8}' | sort -nr | head -12 | sed 's/^/  /'
            echo
            echo "Package check:"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^native-code:" | sed 's/ compileSdkVersion.*//'
          } > release-body.md
          "$BT/apksigner" verify "$APK" && echo "apksigner verify: ok"
          cat release-body.md
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Friday.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: friday-release-apk
          path: "build/app/outputs/flutter-apk/Friday.apk"
      - name: Publish GitHub release v78
        if: github.ref_name == 'fix/v78-reminders'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v78
          name: Friday v78
          target_commitish: ${{ github.sha }}
          make_latest: false
          body_path: release-body.md
          files: build/app/outputs/flutter-apk/Friday.apk
