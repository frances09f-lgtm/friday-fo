name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, redesign/orion-ui, fix/v78-reminders]
jobs:
  build:
    concurrency:
      group: friday-v78-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.FRIDAY_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/friday-release.jks
          cat >> android/gradle.properties <<GP
          FRIDAY_KEYSTORE_FILE=$RUNNER_TEMP/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD=${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS=${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD=${{ secrets.FRIDAY_KEY_PASSWORD }}
          GP
      - name: CI build memory (keep local low-memory settings unchanged)
        run: |
          free -m
          cat >> android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          GP
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.78 --build-number=78
      - name: Native task evaluation tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
      - name: Size report and APK checks
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIZE=$(stat -c %s "$APK")
          {
            echo "Simple reminders (remind me to X at 9:42, at 942, in 10 minutes) are now read by plain code and saved, in the Friday chat and in the floating bar. The assistant bar is back at the v74 size (full screen width, same height as v74); the bubble keeps the v75 size. Includes the v76 alerts fix and the v75 size cut. Checked by CI, not tested on a phone."
            echo
            echo "APK size: $SIZE bytes (v74 was 159865680 bytes, v75 was 40654213 bytes, v76 was 40658493 bytes, v77 was 40658477 bytes)"
            echo
            echo "Native libraries per ABI, uncompressed bytes:"
            unzip -l "$APK" | awk '$4 ~ /^lib\// {split($4,a,"/"); s[a[2]]+=$1} END{for(k in s) print "  " k ": " s[k]}'
            echo
            echo "Largest entries, uncompressed bytes / stored bytes / name:"
            unzip -lv "$APK" | awk '$1 ~ /^[0-9]+$/ && $8 != "" {print $1, $3, $8}' | sort -nr | head -12 | sed 's/^/  /'
            echo
            echo "Package check:"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^native-code:" | sed 's/ compileSdkVersion.*//'
          } > release-body.md
          "$BT/apksigner" verify "$APK" && echo "apksigner verify: ok"
          cat release-body.md
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Friday.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: friday-release-apk
          path: "build/app/outputs/flutter-apk/Friday.apk"
      # LIVE updater test evidence: the widget test renders the real
      # release-feed dialog to live-update-dialog.png in the repo root.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-update-dialog
          path: "live-update-dialog*.png"
          if-no-files-found: ignore
      - name: Publish GitHub release v78
        if: github.ref_name == 'fix/v78-reminders'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v78
          name: Friday v78
          target_commitish: ${{ github.sha }}
          make_latest: false
          body_path: release-body.md
          files: build/app/outputs/flutter-apk/Friday.apk
