plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Auto-generate a debug keystore on first build so `flutter build apk
// --release` works everywhere with zero setup. Replace with a real release
// keystore before publishing to a store.
def fridayKeystoreFile = providers.gradleProperty("FRIDAY_KEYSTORE_FILE").orNull
def debugKeystoreFile = file("debug.keystore")
if (!debugKeystoreFile.exists()) {
    exec {
        commandLine 'keytool', '-genkeypair', '-v',
            '-keystore', debugKeystoreFile.absolutePath,
            '-alias', 'androiddebugkey',
            '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
            '-storepass', 'android', '-keypass', 'android',
            '-dname', 'CN=Android Debug,O=Android,C=US'
    }
}

android {
    namespace = "com.friday.assistant"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // No API credentials are compiled into BuildConfig.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId = "com.friday.assistant"
        minSdk = 26
        targetSdk = 34
        // Wired to flutter's --build-number/--build-name (CI bumps per run).
        // Hardcoding these is why phones refused every update before.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Size: ship the arm64-v8a build only. Flutter 3.35+ otherwise adds
        // armeabi-v7a and x86_64 filters, which pulls plugin native libraries
        // for those ABIs into the APK.
        ndk {
            abiFilters.clear()
            abiFilters.add("arm64-v8a")
        }
    }

    // Size: store native libraries compressed inside the APK. The phone
    // extracts them at install, so the download is smaller and installed
    // storage use is about the same or a little higher.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
            storeFile = debugKeystoreFile
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        if (fridayKeystoreFile != null) {
            release {
                storeFile = file(fridayKeystoreFile)
                storePassword = providers.gradleProperty("FRIDAY_KEYSTORE_PASSWORD").orNull
                keyAlias = providers.gradleProperty("FRIDAY_KEY_ALIAS").orNull
                keyPassword = providers.gradleProperty("FRIDAY_KEY_PASSWORD").orNull
            }
        }
    }

    buildTypes {
        release {
            // Stable release key from repo secrets in CI so updates install
            // over the top; local builds fall back to the debug key.
            signingConfig = fridayKeystoreFile != null ? signingConfigs.release : signingConfigs.debug
            // Size: R8 code shrinking and resource shrinking. Keep rules are in
            // proguard-rules.pro; resource keeps are in res/raw/keep.xml.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
