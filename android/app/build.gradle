plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Auto-generate a debug keystore on first build so `flutter build apk
// --release` works everywhere with zero setup. Replace with a real release
// keystore before publishing to a store.
def debugKeystoreFile = file("debug.keystore")
if (!debugKeystoreFile.exists()) {
    exec {
        commandLine 'keytool', '-genkeypair', '-v',
            '-keystore', debugKeystoreFile.absolutePath,
            '-alias', 'androiddebugkey',
            '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
            '-storepass', 'android', '-keypass', 'android',
            '-dname', 'CN=Android Debug,O=Android,C=US'
    }
}

android {
    namespace = "com.friday.assistant"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.friday.assistant"
        minSdk = 26
        targetSdk = 34
        // Wired to flutter's --build-number/--build-name (CI bumps per run).
        // Hardcoding these is why phones refused every update before.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {
            storeFile = debugKeystoreFile
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // Debug signing so `flutter build apk --release` works out of the
            // box. Replace with your own keystore before shipping to stores.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
