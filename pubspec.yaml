name: friday
description: Friday, an on-device AI phone assistant for Android. Voice and text in, answers out, phone actions done.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.5.0
  record: ^6.1.1
  flutter_tts: ^4.0.2
  android_intent_plus: ^5.0.2
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  flutter_gemma: ^1.8.0
  timezone: ^0.9.4
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
